config-version = 2

# ── Avvio ──────────────────────────────────────────────────────────────────
start-at-login = true
after-startup-command = []

# ── Normalizzazioni ────────────────────────────────────────────────────────
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# ── Layout ─────────────────────────────────────────────────────────────────
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# ── Comportamento ──────────────────────────────────────────────────────────
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

# Workspace persistenti (solo quelli che usi davvero)
persistent-workspaces = ["1", "2", "3", "4", "5"]

# ── Multi-monitor ──────────────────────────────────────────────────────────
# I due SA273 hanno lo stesso nome, quindi si usa la posizione (1 = monitor
# più a sinistra). Disposizione attuale: SA273 sopra il MacBook (pos 1),
# MacBook (pos 2), SA273 a destra (pos 3).
#   - 2 SA273:    WS1 → SA273 a destra, WS2 → SA273 sopra, 3-5 → MacBook
#   - 1 esterno:  'secondary' = l'esterno → 1-2 lì, 3-5 sul MacBook
#   - nessuno:    tutto sul MacBook
# Se cambi la disposizione in Impostazioni → Monitor, controlla
# `aerospace list-monitors` e aggiorna i numeri.
[workspace-to-monitor-force-assignment]
    1 = ['secondary', 3, 'main']
    2 = ['secondary', 1, 'main']
    3 = 'built-in'
    4 = 'built-in'
    5 = 'built-in'

[key-mapping]
    preset = 'qwerty'

# ── Gap tra finestre ───────────────────────────────────────────────────────
[gaps]
    inner.horizontal = 8
    inner.vertical   = 8
    outer.left       = 8
    outer.bottom     = 8
    outer.top        = 8
    outer.right      = 8

# ── App floating (non vogliono essere tilegiate) ───────────────────────────
# Queste app aprono finestre piccole/dialog che stonano nel tiling
[[on-window-detected]]
if.app-name-regex-substring = 'System Preferences|System Settings|Calculator|Archive Utility|Alfred|Raycast|1Password|Logi Options'
run = 'layout floating'

# ── Assegnazione app a workspace ───────────────────────────────────────────
# Con HDMI: 1-2 stanno sull'esterno (codice), 3-5 sul MacBook (colori corretti).
# Senza HDMI sono tutti sul MacBook, quindi i numeri restano gli stessi.

# WS 1 — codice + terminale (esterno)
[[on-window-detected]]
if.app-name-regex-substring = 'Code|Cursor|Ghostty'
run = 'move-node-to-workspace 1'

# WS 2 — appoggio: Finder, Obsidian, Claude (esterno)
[[on-window-detected]]
if.app-name-regex-substring = 'Finder|Obsidian|Claude'
run = 'move-node-to-workspace 2'

# WS 3 — browser (MacBook)
[[on-window-detected]]
if.app-name-regex-substring = 'Firefox|Helium|Safari|Chrome'
run = 'move-node-to-workspace 3'

# WS 4 — simulatori (MacBook)
[[on-window-detected]]
if.app-name-regex-substring = 'Simulator|Xcode|Emulator'
run = 'move-node-to-workspace 4'

# WS 5 — libero

# ── Keybinding: modalità principale ───────────────────────────────────────
[mode.main.binding]

    # Apri terminale (modifica con la tua app) — option-enter
    alt-enter = '''exec-and-forget osascript -e '
    tell application "Ghostty"
        activate
        do script
    end tell'
    '''

    # Layout — option-slash / option-comma
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    # Focus finestre (vim-style) — option-h/j/k/l
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    # Sposta finestre — option-shift-h/j/k/l
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # Workspace — option-1…5
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'

    # Sposta finestra a workspace — option-shift-1…5
    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'

    # Navigazione workspace — option-tab / option-shift-tab
    alt-tab        = 'workspace-back-and-forth'
    alt-shift-tab  = 'move-workspace-to-monitor --wrap-around next'

    # Monitor — option-m / option-shift-m
    alt-m       = 'focus-monitor --wrap-around next'
    alt-shift-m = 'move-node-to-monitor --wrap-around next --focus-follows-window'

    # Entra nei mode secondari — option-shift-; / option-shift-r
    alt-shift-semicolon = 'mode service'
    alt-shift-r         = 'mode resize'

# ── Keybinding: service mode ───────────────────────────────────────────────
[mode.service.binding]
    esc       = ['reload-config', 'mode main']
    r         = ['flatten-workspace-tree', 'mode main']  # reset layout
    f         = ['layout floating tiling', 'mode main']  # toggle floating
    backspace = ['close-all-windows-but-current', 'mode main']

    alt-shift-h = ['join-with left',  'mode main']
    alt-shift-j = ['join-with down',  'mode main']
    alt-shift-k = ['join-with up',    'mode main']
    alt-shift-l = ['join-with right', 'mode main']

# ── Keybinding: resize mode ────────────────────────────────────────────────
# Premi option-shift-r, poi usa h/j/k/l per ridimensionare, esc per uscire
[mode.resize.binding]
    h           = 'resize width -50'
    l           = 'resize width +50'
    k           = 'resize height -50'
    j           = 'resize height +50'
    esc         = 'mode main'
    enter       = 'mode main'
    alt-shift-r = 'mode main'   # ripremere il trigger fa da "toggle" e ti fa uscire